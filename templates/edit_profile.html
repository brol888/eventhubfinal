{% extends "base.html" %}
{% block content %}
    <h2>Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        <p>{{ form.name.label }}<br>{{ form.name() }}</p>
        <p>{{ form.email.label }}<br>{{ form.email() }}</p>
        <p>{{ form.picture.label }}<br>{{ form.picture() }}</p>
        {{ form.submit() }}
    </form>
{% endblock %}
